# /etc/systemd/journald@vendor-audit.conf
#
# The vendor-audit service's own journal (LogNamespace=vendor-audit in
# vendor-audit.service). Its log holds each audit request with the
# visitor's IP address, and the front page says those are kept for 30
# days, so this namespace deletes entries after 30 days. The rest of the
# system journal is unaffected.
#
# Install:  sudo install -m 644 deploy/journald@vendor-audit.conf /etc/systemd/
# Read:     sudo vendor-audit-log            (deploy/vendor-audit-log)
#           sudo journalctl --namespace=vendor-audit -u vendor-audit

[Journal]
# Keep it on disk (/var/log/journal/<machine-id>.vendor-audit/), so it
# survives reboots for the full 30 days.
Storage=persistent

# Delete entries older than 30 days. journald removes whole journal
# files, so files are rotated daily: an entry is gone within a day of
# turning 30 days old.
MaxRetentionSec=30day
MaxFileSec=1day

# A size cap as well, in case of a flood of requests.
SystemMaxUse=1G

# Keep these lines out of /var/log/syslog, which has its own retention.
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
