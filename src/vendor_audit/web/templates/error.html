<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Audit — {{ title }}</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  /* Palette kept in sync with form.html, loading.html, render_html.py. */
  :root {
    --bg:           rgb(34, 34, 33);
    --surface:      rgb(44, 44, 42);
    --fg:           #ededeb;
    --muted:        #bdbdba;
    --border:       #57574f;
    --border-soft:  #3e3e3a;
    --accent:       #7eb6ff;
    --accent-hover: #a3cbff;
    --fail:         #f87171;
    --fail-bg:      #3a1a1a;
  }
  * { box-sizing: border-box; }
  body {
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--fg);
    background: var(--bg);
    background-image: linear-gradient(180deg, rgb(36, 36, 35) 0%, rgb(33, 33, 32) 100%);
    background-attachment: fixed;
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  @media (max-width: 600px) {
    body { place-items: start center; padding: 1rem 1rem 2rem; }
  }
  main { max-width: 560px; width: 100%; text-align: center; }
  .brand-link {
    display: inline-block;
    color: inherit;
    text-decoration: none;
  }
  .logo {
    width: 48px; height: 48px;
    margin: 0 auto 0.6rem;
    color: var(--fg);
  }
  .logo svg { display: block; width: 100%; height: 100%; }
  h1 { font-size: 1.4rem; margin: 0 0 0.4rem; color: var(--fg); }
  .message {
    background: var(--fail-bg);
    border-left: 4px solid var(--fail);
    padding: 0.85rem 1rem;
    margin: 1rem 0;
    border-radius: 0 4px 4px 0;
    text-align: left;
    color: var(--fg);
  }
  .code {
    color: var(--muted);
    font: 0.85em ui-monospace, monospace;
    margin-bottom: 1rem;
  }
  a { color: var(--accent); }
  a:hover { color: var(--accent-hover); }
  footer {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 2rem;
  }
</style>
</head>
<body>
<main>
<a class="brand-link" href="/" aria-label="Vendor Audit home">
<div class="logo">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="va-title va-desc">
  <title id="va-title">Vendor Audit</title>
  <desc id="va-desc">Magnifying glass framing a small node graph, representing domain posture inspection.</desc>
  <circle cx="40" cy="40" r="28" fill="none" stroke="currentColor" stroke-width="3"/>
  <line x1="60" y1="60" x2="82" y2="82" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <line x1="32" y1="38" x2="46" y2="34" stroke="#7eb6ff" stroke-width="1"/>
  <line x1="46" y1="34" x2="50" y2="48" stroke="#7eb6ff" stroke-width="1"/>
  <line x1="32" y1="38" x2="50" y2="48" stroke="#7eb6ff" stroke-width="1"/>
  <circle cx="32" cy="38" r="3" fill="#7eb6ff"/>
  <circle cx="46" cy="34" r="3" fill="#7eb6ff"/>
  <circle cx="50" cy="48" r="3" fill="#7eb6ff"/>
</svg>
</div>
</a>
<h1>{{ title }}</h1>
<div class="message">{{ message }}</div>
<div class="code">code: {{ code }}</div>
<p><a href="/">← Try a different domain</a></p>
<footer>Vendor Audit v{{ version }}</footer>
</main>
</body>
</html>
