# Runs the test suite on every push and pull request, on each Python
# version the package supports (pyproject.toml: requires-python >= 3.10).
#
# The tests make no network requests and run in a few seconds per version.
# A red cross on a commit means a test failed: open the run on GitHub, then
# the failing version, to see which check failed and why.
#
# Actions are pinned to full commit hashes, not tags, so a moved tag can't
# change what runs here. The comment after each hash names its release.

name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e '.[web,dev]'

      - name: Tests
        run: python -m pytest

      - name: CLI starts
        run: vendor-audit --version
